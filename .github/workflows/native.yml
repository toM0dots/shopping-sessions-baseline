name: Native Linux container
on:
  push:
    paths:
      - '.github/workflows/native.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'pipeline/**'
      - 'fast/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'requirements*.txt'
      - 'run.sh'
  pull_request:
    paths:
      - '.github/workflows/native.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'pipeline/**'
      - 'fast/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'requirements*.txt'
      - 'run.sh'
permissions:
  contents: read
jobs:
  container-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth 1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: Install official checker dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check parser semantics and memory boundaries
        run: |
          git fetch --depth 1 origin a7cd5c1d43390cfb3960f2a11a9e13a5d44c8f9f
          .venv/bin/python scripts/check_parser_semantics.py
          .venv/bin/python scripts/check_parser_semantics.py --scalar
      - name: Check compact key semantics and memory boundaries
        run: |
          .venv/bin/python scripts/check_keys.py
          .venv/bin/python scripts/check_keys.py --scalar
      - name: Check partial-output cleanup
        run: |
          rustc --edition=2021 --test fast/src/fallback.rs -o /tmp/shopping-fallback-test
          /tmp/shopping-fallback-test
      - name: Build Linux image
        run: docker build --build-arg BUILD_JOBS=4 -t shopping-sessions:ci .
      - name: Run all fixtures with scorer isolation flags
        env:
          IMAGE: shopping-sessions:ci
          CPUS: "2"
          MEM: 6g
        run: .venv/bin/python scripts/run_fixtures.py fixtures -- scripts/docker_run.sh
      - name: Compare 20M-event containers when requested
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[benchmark]')
        run: .venv/bin/python scripts/benchmark_linux.py
      - name: Prepare generator and native engine binaries
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[fast-benchmark]') || contains(github.event.head_commit.message, '[fast-check]'))
        run: |
          lscpu
          git fetch --depth 1 origin c0bcee19170616f31e54656a65466e37aca8255d
          .venv/bin/python scripts/benchmark_fastpath.py --prepare-only
      - name: Check generator-aware engine against independent reference
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[fast-benchmark]') || contains(github.event.head_commit.message, '[fast-check]'))
        run: |
          .venv/bin/python scripts/check_generator_fastpath.py build/fastpath-ci/generator-target/release/generate \
            --candidate build/fastpath-ci/bin/shopping-sessions-dispatch \
            --baseline build/fastpath-ci/bin/shopping-sessions \
            --report logs/generator-fastpath-validation.json
      - name: Benchmark complete outputs on practice and final scale
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[fast-benchmark]')
        run: |
          .venv/bin/python scripts/benchmark_fastpath.py \
            --generator build/fastpath-ci/generator-target/release/generate
