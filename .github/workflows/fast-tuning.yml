name: Fast engine paired tuning
on:
  push:
    paths:
      - '.github/workflows/fast-tuning.yml'
      - 'fast/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  paired-tuning:
    if: contains(github.event.head_commit.message, '[fast-tune]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASELINE_REF: fd56b794f7efe74bcb4e8d32bd653f4df923c7fb
    steps:
      - name: Check out the exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth 1 origin "$REVISION" "$BASELINE_REF" c0bcee19170616f31e54656a65466e37aca8255d
          git checkout --detach "$REVISION"
      - name: Require matching fast-engine CPU before building
        run: |
          cat > /tmp/check-fast-cpu.cpp <<'CPP'
          #define main dispatch_entry_main
          #include "pipeline/dispatch.cpp"
          #undef main
          int main() {
              if (!fast_cpu()) {
                  std::fputs("INCOMPATIBLE_BENCHMARK_HOST: retry on a runner with the required AVX-512 CPU/OS features\n", stderr);
                  return 1;
              }
              std::puts("Fast-engine CPU and OS feature contract satisfied");
          }
          CPP
          g++ -O2 -std=c++17 -I "$PWD" /tmp/check-fast-cpu.cpp -o /tmp/check-fast-cpu
          /tmp/check-fast-cpu
      - name: Install checker dependencies and inspect topology
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          lscpu
          lscpu --extended=CPU,CORE,SOCKET,ONLINE
      - name: Check affinity and fallback cleanup
        run: |
          rustc --edition=2021 --test fast/src/affinity.rs -o /tmp/affinity-test
          /tmp/affinity-test
          rustc --edition=2021 --test fast/src/fallback.rs -o /tmp/fallback-test
          /tmp/fallback-test
          rustc --edition=2021 --test fast/src/input_release.rs -o /tmp/input-release-test
          /tmp/input-release-test
      - name: Build candidate production image
        run: docker build --build-arg BUILD_JOBS=4 -t shopping-sessions:ci .
      - name: Build original fast engine over the same runtime image
        run: |
          mkdir -p build/tuning-baseline/source build/tuning-baseline/overlay
          git archive "$BASELINE_REF" fast Dockerfile .dockerignore > build/tuning-baseline/source.tar
          tar -xf build/tuning-baseline/source.tar -C build/tuning-baseline/source
          docker build --target fast-builder -t shopping-sessions:original-fast-build build/tuning-baseline/source
          cid=$(docker create shopping-sessions:original-fast-build)
          docker cp "$cid:/fast-bin/shopping-sessions-fast" build/tuning-baseline/overlay/shopping-sessions-fast
          docker rm "$cid"
          git show "$BASELINE_REF:pipeline/dispatch.cpp" | cmp - pipeline/dispatch.cpp
          git show "$BASELINE_REF:pipeline/native.cpp" | cmp - pipeline/native.cpp
          cat > build/tuning-baseline/overlay/Dockerfile <<'DOCKER'
          FROM shopping-sessions:ci
          COPY shopping-sessions-fast /app/build/shopping-sessions-fast
          DOCKER
          docker build -t shopping-sessions:original-fast build/tuning-baseline/overlay
      - name: Run isolated official fixtures
        env:
          IMAGE: shopping-sessions:ci
          CPUS: '2'
          MEM: 6g
        run: .venv/bin/python scripts/run_fixtures.py fixtures -- scripts/docker_run.sh
      - name: Prepare official generator and candidate binaries
        run: .venv/bin/python scripts/benchmark_fastpath.py --prepare-only
      - name: Check independent reference and public golden outputs
        if: "!contains(github.event.head_commit.message, '[parser-sweep]')"
        run: |
          .venv/bin/python scripts/check_generator_fastpath.py build/fastpath-ci/generator-target/release/generate \
            --candidate build/fastpath-ci/bin/shopping-sessions-dispatch \
            --baseline build/fastpath-ci/bin/shopping-sessions \
            --report logs/generator-tuning-validation.json
          .venv/bin/python scripts/check_public_fastpath.py build/fastpath-ci/generator-target/release/generate \
            --candidate build/fastpath-ci/bin/shopping-sessions-dispatch \
            --report logs/public-generator-tuning.json
      - name: Profile complete execution phases
        if: "!contains(github.event.head_commit.message, '[fast-promote]')"
        run: |
          .venv/bin/python scripts/benchmark_fastpath.py --baseline-image shopping-sessions:original-fast --baseline-ref "$BASELINE_REF" \
            --generator build/fastpath-ci/generator-target/release/generate --work build/tuning-profile \
            --baseline-env XL_TIMING=1 --candidate-env XL_TIMING=1 \
            --case 17:20000000:1 --case 948307:60000000:1 --report logs/linux-fast-tuning-profile.json
      - name: Compare production defaults against the scored engine
        if: "!contains(github.event.head_commit.message, '[parser-sweep]')"
        run: |
          .venv/bin/python scripts/benchmark_fastpath.py --baseline-image shopping-sessions:original-fast --baseline-ref "$BASELINE_REF" \
            --generator build/fastpath-ci/generator-target/release/generate --work build/tuning-affinity \
            --case 17:20000000:5 --case 8675309:20000000:5 --case 948307:60000000:3 \
            --report logs/linux-fast-tuning-affinity.json
      - name: Compare direct click indexing against the scored engine
        if: "!contains(github.event.head_commit.message, '[fast-promote]')"
        continue-on-error: true
        run: |
          .venv/bin/python scripts/benchmark_fastpath.py --baseline-image shopping-sessions:original-fast --baseline-ref "$BASELINE_REF" \
            --generator build/fastpath-ci/generator-target/release/generate --work build/tuning-click-index \
            --candidate-env XL_CKIX=1 --case 17:20000000:5 --case 8675309:20000000:5 --case 948307:60000000:3 \
            --report logs/linux-fast-tuning-click-index.json
      - name: Compare click indexing with original worker placement
        if: "!contains(github.event.head_commit.message, '[fast-promote]')"
        continue-on-error: true
        run: |
          .venv/bin/python scripts/benchmark_fastpath.py --baseline-image shopping-sessions:original-fast --baseline-ref "$BASELINE_REF" \
            --generator build/fastpath-ci/generator-target/release/generate --work build/tuning-click-affinity-control \
            --candidate-env XL_CKIX=1 --candidate-env XL_CORE_FIRST=0 --case 17:20000000:3 --case 8675309:20000000:3 \
            --report logs/linux-fast-tuning-click-affinity-control.json
      - name: Compare fewer workers at the same CPU limit
        if: "!contains(github.event.head_commit.message, '[fast-promote]')"
        continue-on-error: true
        run: |
          .venv/bin/python scripts/benchmark_fastpath.py --baseline-image shopping-sessions:original-fast --baseline-ref "$BASELINE_REF" \
            --generator build/fastpath-ci/generator-target/release/generate --work build/tuning-workers \
            --candidate-env NCPU=2 --case 17:20000000:3 --case 8675309:20000000:3 \
            --report logs/linux-fast-tuning-workers.json
      - name: Check click indexing against independent and public answers
        if: "!contains(github.event.head_commit.message, '[fast-promote]')"
        run: |
          .venv/bin/python scripts/check_generator_fastpath.py build/fastpath-ci/generator-target/release/generate \
            --candidate 'env XL_CKIX=1 build/fastpath-ci/bin/shopping-sessions-dispatch' \
            --baseline build/fastpath-ci/bin/shopping-sessions \
            --report logs/generator-click-index-validation.json
          .venv/bin/python scripts/check_public_fastpath.py build/fastpath-ci/generator-target/release/generate \
            --candidate 'env XL_CKIX=1 build/fastpath-ci/bin/shopping-sessions-dispatch' \
            --report logs/public-click-index-validation.json
      - name: Compare batched input release against the scored engine
        if: "!contains(github.event.head_commit.message, '[fast-promote]')"
        continue-on-error: true
        run: |
          .venv/bin/python scripts/benchmark_fastpath.py --baseline-image shopping-sessions:original-fast --baseline-ref "$BASELINE_REF" \
            --generator build/fastpath-ci/generator-target/release/generate --work build/tuning-release \
            --candidate-env XL_REL_BATCH=8 --case 17:20000000:3 --case 8675309:20000000:3 --case 948307:60000000:2 \
            --report logs/linux-fast-tuning-release.json
      - name: Compare combined click indexing and batched release
        if: "!contains(github.event.head_commit.message, '[fast-promote]')"
        continue-on-error: true
        run: |
          .venv/bin/python scripts/benchmark_fastpath.py --baseline-image shopping-sessions:original-fast --baseline-ref "$BASELINE_REF" \
            --generator build/fastpath-ci/generator-target/release/generate --work build/tuning-combined \
            --candidate-env XL_CKIX=1 --candidate-env XL_REL_BATCH=8 \
            --case 17:20000000:3 --case 8675309:20000000:3 --case 948307:60000000:2 \
            --report logs/linux-fast-tuning-combined.json
      - name: Validate batched release and explicit pread through exact references
        if: "!contains(github.event.head_commit.message, '[fast-promote]')"
        run: |
          .venv/bin/python scripts/check_generator_fastpath.py build/fastpath-ci/generator-target/release/generate \
            --candidate 'env XL_CKIX=1 XL_REL_BATCH=8 XL_RD=256 build/fastpath-ci/bin/shopping-sessions-dispatch' \
            --baseline build/fastpath-ci/bin/shopping-sessions \
            --report logs/generator-combined-pread-validation.json
      - name: Build isolated parser compile variants
        if: contains(github.event.head_commit.message, '[parser-sweep]')
        run: |
          .venv/bin/python scripts/build_fast_variant.py --tag shopping-sessions:bb14 --set XL_BB=14 --report logs/fast-variant-bb14.json
          .venv/bin/python scripts/build_fast_variant.py --tag shopping-sessions:sub8192 --set XL_SUB_DEF=8192 --report logs/fast-variant-sub8192.json
          .venv/bin/python scripts/build_fast_variant.py --tag shopping-sessions:inline-purchase --set XL_INLINE_PURCHASE=1 --report logs/fast-variant-inline-purchase.json
      - name: Screen parser and I/O variants with complete output comparisons
        if: contains(github.event.head_commit.message, '[parser-sweep]')
        run: |
          .venv/bin/python scripts/sweep_fast_parser.py \
            --generator build/fastpath-ci/generator-target/release/generate \
            --baseline-ref "$BASELINE_REF" --purchase-image shopping-sessions:inline-purchase
      - name: Validate the inline purchase parser against independent answers
        if: contains(github.event.head_commit.message, '[parser-sweep]')
        run: |
          cp build/fastpath-ci/bin/shopping-sessions build/fastpath-ci/bin/shopping-sessions-dispatch build/fast-variants/shopping-sessions_inline-purchase/
          .venv/bin/python scripts/check_generator_fastpath.py build/fastpath-ci/generator-target/release/generate \
            --candidate build/fast-variants/shopping-sessions_inline-purchase/shopping-sessions-dispatch \
            --baseline build/fastpath-ci/bin/shopping-sessions \
            --report logs/generator-inline-purchase-validation.json
          .venv/bin/python scripts/check_public_fastpath.py build/fastpath-ci/generator-target/release/generate \
            --candidate build/fast-variants/shopping-sessions_inline-purchase/shopping-sessions-dispatch \
            --report logs/public-inline-purchase-validation.json
      - name: Verify the screening winner on holdout and final-scale inputs
        if: contains(github.event.head_commit.message, '[parser-sweep]')
        run: |
          .venv/bin/python - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          sys.path.insert(0, 'scripts')
          from benchmark_linux import run
          report = json.loads(pathlib.Path('logs/linux-fast-parser-sweep.json').read_text())
          if report['status'] != 'passed':
              raise SystemExit('Screening must pass before selecting a candidate')
          winner = min(report['variants'], key=lambda v: v['summary']['candidate']['container_seconds']['median'] / v['summary']['baseline']['container_seconds']['median'])
          selection = {'label': winner['label'], 'settings': winner['settings'], 'image': winner['image'],
                       'selection_method': 'Lowest median candidate/baseline ratio in the complete predeclared screening set; requires separate holdout confirmation',
                       'screening_source': 'logs/linux-fast-parser-sweep.json'}
          pathlib.Path('logs/fast-parser-selection.json').write_text(json.dumps(selection, indent=2) + '\n')
          print('BEGIN_FAST_PARSER_SELECTION_JSON')
          print(json.dumps(selection, indent=2))
          print('END_FAST_PARSER_SELECTION_JSON', flush=True)
          cid = run(['docker', 'create', winner['image']['id']], capture_output=True, text=True).stdout.strip()
          binaries = pathlib.Path('build/parser-selected/bin').resolve()
          binaries.mkdir(parents=True)
          try:
              run(['docker', 'cp', f'{cid}:/app/build/.', binaries])
              commit = ['docker', 'commit', '--pause=false']
              for key, value in winner['settings'].items():
                  commit += ['--change', f'ENV {key}={value}']
              run([*commit, cid, 'shopping-sessions:parser-selected'])
          finally:
              run(['docker', 'rm', cid])
          fixture_env = dict(os.environ, IMAGE='shopping-sessions:parser-selected', CPUS='2', MEM='6g')
          subprocess.run([sys.executable, 'scripts/run_fixtures.py', 'fixtures', '--', 'scripts/docker_run.sh'], env=fixture_env, check=True)
          command = shlex.join(['env', *[f'{k}={v}' for k, v in winner['settings'].items()], str(binaries / 'shopping-sessions-dispatch')])
          generator = 'build/fastpath-ci/generator-target/release/generate'
          if winner['label'] != 'inline_purchase':
              run([sys.executable, 'scripts/check_generator_fastpath.py', generator, '--candidate', command,
                   '--baseline', 'build/fastpath-ci/bin/shopping-sessions', '--report', 'logs/generator-selected-parser-validation.json'])
              run([sys.executable, 'scripts/check_public_fastpath.py', generator, '--candidate', command,
                   '--report', 'logs/public-selected-parser-validation.json'])
          benchmark = [sys.executable, 'scripts/benchmark_fastpath.py', '--image', 'shopping-sessions:parser-selected',
                       '--baseline-image', 'shopping-sessions:original-fast', '--baseline-ref', os.environ['BASELINE_REF'],
                       '--generator', generator, '--work', 'build/parser-selected/paired',
                       '--case', '17:20000000:5', '--case', '8675309:20000000:5', '--case', '948307:60000000:3',
                       '--report', 'logs/linux-selected-parser-paired.json']
          for key, value in winner['settings'].items():
              benchmark += ['--candidate-env', f'{key}={value}']
          run(benchmark)
          PY
